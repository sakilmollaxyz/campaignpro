<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampaignPro</title>

    <!-- টেলিগ্রাম ওয়েবের স্ক্রিপ্ট -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            background: #f5f7fb; color: #172033; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        /* =========================
           MAIN WRAPPER & BRAND
        ========================= */
        .login-wrapper { width: 100%; max-width: 420px; }
        .brand { text-align: center; margin-bottom: 25px; }
        .brand-name { font-size: 29px; font-weight: 800; color: #111827; }
        .brand-name span { color: #059669; }
        .brand-subtitle { margin-top: 7px; color: #64748b; font-size: 14px; }

        /* =========================
           CARD
        ========================= */
        .login-card {
            background: #ffffff; border-radius: 18px; padding: 30px 26px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }
        .login-card h1 { font-size: 25px; color: #111827; margin-bottom: 8px; }
        .login-description { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }

        /* =========================
           MESSAGE
        ========================= */
        .message {
            display: none; padding: 12px 14px; border-radius: 9px;
            font-size: 13px; line-height: 1.5; margin-bottom: 17px;
        }
        .message.error { background: #fee2e2; color: #991b1b; }
        .message.success { background: #dcfce7; color: #166534; }

        /* =========================
           FORM
        ========================= */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 7px; }
        .form-group input {
            width: 100%; padding: 13px 14px; border: 1px solid #dbe1ea;
            border-radius: 9px; background: #ffffff; color: #172033;
            font-size: 15px; outline: none; transition: .2s;
        }
        .form-group input:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5, 150, 105, .10); }
        .form-group input::placeholder { color: #9ca3af; }

        /* =========================
           LOGIN BUTTON
        ========================= */
        .login-btn {
            width: 100%; border: none; background: #059669; color: #ffffff;
            padding: 13px; border-radius: 9px; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: .2s; margin-top: 3px;
        }
        .login-btn:hover { background: #047857; }
        .login-btn:active { transform: scale(.99); }
        .login-btn:disabled { opacity: .65; cursor: not-allowed; }

        /* =========================
           LINKS
        ========================= */
        .signup-link { text-align: center; margin-top: 22px; color: #64748b; font-size: 14px; }
        .signup-link a { color: #059669; font-weight: 700; text-decoration: none; margin-left: 3px; }
        .signup-link a:hover { text-decoration: underline; }
        .home-link { display: block; text-align: center; margin-top: 18px; color: #64748b; font-size: 13px; text-decoration: none; }
        .home-link:hover { color: #059669; }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 480px) {
            body { padding: 15px; }
            .login-card { padding: 25px 20px; }
            .brand-name { font-size: 26px; }
            .login-card h1 { font-size: 23px; }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <!-- =========================
         BRAND
    ========================= -->
    <div class="brand">
        <div class="brand-name">Campaign<span>Pro</span></div>
        <div class="brand-subtitle">Smart Campaign Management Platform</div>
    </div>

    <!-- =========================
         LOGIN CARD
    ========================= -->
    <div class="login-card">

        <h1>আবার স্বাগতম 👋</h1>
        <p class="login-description">
            আপনার CampaignPro অ্যাকাউন্টে Login করুন এবং আপনার campaign পরিচালনা শুরু করুন।
        </p>

        <!-- =========================
             MESSAGES
        ========================= -->
        <div id="errorMessage" class="message error"></div>
        <div id="successMessage" class="message success"></div>

        <!-- =========================
             LOGIN FORM
        ========================= -->
        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="আপনার Password" autocomplete="current-password" required>
            </div>

            <button type="submit" id="loginButton" class="login-btn">
                Login
            </button>

        </form>

        <!-- =========================
             LINKS
        ========================= -->
        <div class="signup-link">
            নতুন ইউজার?
            <a href="signup.html">Sign Up করুন</a>
        </div>

        <a href="index.html" class="home-link">
            ← Home Page-এ ফিরে যান
        </a>

    </div>
</div>

<!-- =========================
     FIREBASE AUTH LOGIC
========================= -->
<script type="module">
    import { auth, checkAuthStatus } from './firebase.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // পেজ লোড হলে চেক করবে ইউজার ইতিমধ্যে লগইন করা কি না
    checkAuthStatus();

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
        successMessage.style.display = "none";
    }

    function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.style.display = "block";
        errorMessage.style.display = "none";
    }

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showError("Email এবং Password সঠিকভাবে লিখুন।");
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            // ফায়ারবেজ লগইন রিকোয়েস্ট
            await signInWithEmailAndPassword(auth, email, password);
            
            showSuccess("লগইন সফল হয়েছে! ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে...");
            
            // সফল হলে ড্যাশবোর্ডে পাঠিয়ে দেওয়া হবে
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);

        } catch (error) {
            console.error("Login Error:", error);
            
            // এরর মেসেজ হ্যান্ডলিং
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                showError("ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।");
            } else {
                showError("একটি সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।");
            }
            
            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    });
</script>

</body>
</html>
