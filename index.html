<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampaignPro</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <h1>CampaignPro</h1>

    <p id="status">
        Firebase connecting...
    </p>

    <script type="module">

        import {
            db,
            auth
        } from "./js/firebase-config.js";

        const status =
            document.getElementById("status");

        if (db && auth) {

            status.textContent =
                "✅ Firebase connected successfully!";

        } else {

            status.textContent =
                "❌ Firebase connection failed.";

        }

    </script>

</body>

</html>
