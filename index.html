<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampaignPro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #34d399;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav button {
            border: 0;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .hero {
            background: linear-gradient(135deg, #111827, #172554);
            color: white;
            padding: 35px 25px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 32px;
            margin-top: 0;
        }

        .hero span {
            color: #34d399;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0 15px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #059669;
        }

        label {
            font-weight: bold;
        }

        .btn {
            border: 0;
            padding: 12px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background: #059669;
        }

        .btn:hover {
            opacity: .9;
        }

        .btn-red {
            background: #dc2626;
        }

        .message {
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .user-box {
            background: #ecfdf5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .hidden {
            display: none !important;
        }

        @media(max-width:600px) {
            header {
                align-items: flex-start;
            }

            .hero h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Campaign<span>Pro</span>
    </div>

    <nav>
        <button id="homeBtn">Home</button>
        <button id="loginNavBtn">Login</button>
        <button id="registerNavBtn">Register</button>
        <button id="dashboardNavBtn" class="hidden">Dashboard</button>
        <button id="logoutBtn" class="hidden">Logout</button>
    </nav>

</header>


<div class="container">

    <!-- GLOBAL MESSAGE -->
    <div id="message" class="message"></div>


    <!-- HOME -->
    <section id="homeSection">

        <div class="hero">

            <h1>
                Welcome to
                <span>CampaignPro</span>
            </h1>

            <p>
                আপনার Campaign পরিচালনা করুন
                সহজে এবং নিরাপদে।
            </p>

            <button
                class="btn"
                id="startBtn"
            >
                Get Started
            </button>

        </div>

    </section>


    <!-- REGISTER -->
    <section
        id="registerSection"
        class="hidden"
    >

        <div class="card">

            <h2>
                Create Account
            </h2>

            <p>
                নতুন CampaignPro account তৈরি করুন।
            </p>

            <form id="registerForm">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="আপনার নাম"
                    required
                >

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@email.com"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    Create Account
                </button>

            </form>

            <p>
                Already have an account?
                <button
                    id="goLoginBtn"
                    style="border:0;background:none;color:#059669;cursor:pointer;"
                >
                    Login
                </button>
            </p>

        </div>

    </section>


    <!-- LOGIN -->
    <section
        id="loginSection"
        class="hidden"
    >

        <div class="card">

            <h2>
                Login
            </h2>

            <p>
                আপনার CampaignPro account-এ প্রবেশ করুন।
            </p>

            <form id="loginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="example@email.com"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <button
                    id="goRegisterBtn"
                    style="border:0;background:none;color:#059669;cursor:pointer;"
                >
                    Register
                </button>
            </p>

        </div>

    </section>


    <!-- DASHBOARD -->
    <section
        id="dashboardSection"
        class="hidden"
    >

        <div class="card">

            <h2>
                Dashboard
            </h2>

            <div class="user-box">

                <strong>
                    Logged in successfully! ✅
                </strong>

                <p id="userName"></p>

                <p id="userEmail"></p>

                <button
                    id="dashboardLogoutBtn"
                    class="btn btn-red"
                >
                    Logout
                </button>

            </div>

        </div>

    </section>

</div>


<script type="module">

    /*
     * Firebase
     */

    import {
        auth,
        db
    } from "./js/firebase-config.js";

    import {
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /*
     * Sections
     */

    const homeSection =
        document.getElementById("homeSection");

    const registerSection =
        document.getElementById("registerSection");

    const loginSection =
        document.getElementById("loginSection");

    const dashboardSection =
        document.getElementById("dashboardSection");


    /*
     * Navigation buttons
     */

    const homeBtn =
        document.getElementById("homeBtn");

    const loginNavBtn =
        document.getElementById("loginNavBtn");

    const registerNavBtn =
        document.getElementById("registerNavBtn");

    const dashboardNavBtn =
        document.getElementById("dashboardNavBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const startBtn =
        document.getElementById("startBtn");

    const goLoginBtn =
        document.getElementById("goLoginBtn");

    const goRegisterBtn =
        document.getElementById("goRegisterBtn");

    const dashboardLogoutBtn =
        document.getElementById("dashboardLogoutBtn");


    /*
     * User information
     */

    const userName =
        document.getElementById("userName");

    const userEmail =
        document.getElementById("userEmail");


    /*
     * Message
     */

    const message =
        document.getElementById("message");


    function showMessage(
        text,
        type = "success"
    ) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";

        setTimeout(() => {

            message.style.display =
                "none";

        }, 5000);
    }


    /*
     * Show section
     */

    function showSection(section) {

        homeSection.classList.add("hidden");
        registerSection.classList.add("hidden");
        loginSection.classList.add("hidden");
        dashboardSection.classList.add("hidden");

        section.classList.remove("hidden");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /*
     * Navigation
     */

    homeBtn.addEventListener(
        "click",
        () => showSection(homeSection)
    );

    loginNavBtn.addEventListener(
        "click",
        () => showSection(loginSection)
    );

    registerNavBtn.addEventListener(
        "click",
        () => showSection(registerSection)
    );

    startBtn.addEventListener(
        "click",
        () => {

            if (auth.currentUser) {

                showSection(
                    dashboardSection
                );

            } else {

                showSection(
                    registerSection
                );

            }

        }
    );

    goLoginBtn.addEventListener(
        "click",
        () => showSection(loginSection)
    );

    goRegisterBtn.addEventListener(
        "click",
        () => showSection(registerSection)
    );

    dashboardNavBtn.addEventListener(
        "click",
        () => showSection(dashboardSection)
    );


    /*
     * REGISTER
     */

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const name =
                    document
                        .getElementById("registerName")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("registerEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("registerPassword")
                        .value;

                if (password.length < 8) {

                    showMessage(
                        "Password কমপক্ষে 8 characters হতে হবে।",
                        "error"
                    );

                    return;
                }

                try {

                    const result =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );

                    const user =
                        result.user;


                    /*
                     * Save user profile
                     * in Firestore
                     */

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {
                            name: name,
                            email: user.email,
                            balance: 0,
                            role: "user",
                            createdAt:
                                serverTimestamp()
                        }
                    );


                    showMessage(
                        "Account successfully created! ✅"
                    );

                    document
                        .getElementById("registerForm")
                        .reset();

                    showSection(
                        dashboardSection
                    );

                } catch (error) {

                    console.error(error);

                    let text =
                        "Registration failed.";

                    if (
                        error.code ===
                        "auth/email-already-in-use"
                    ) {

                        text =
                            "এই email দিয়ে account আগে থেকেই আছে।";

                    } else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        text =
                            "Email address সঠিক নয়।";

                    } else if (
                        error.code ===
                        "auth/weak-password"
                    ) {

                        text =
                            "Password আরও শক্তিশালী দিন।";
                    }

                    showMessage(
                        text,
                        "error"
                    );
                }

            }
        );


    /*
     * LOGIN
     */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;

                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                    showMessage(
                        "Login successful! ✅"
                    );

                    document
                        .getElementById("loginForm")
                        .reset();

                    showSection(
                        dashboardSection
                    );

                } catch (error) {

                    console.error(error);

                    let text =
                        "Login failed.";

                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        text =
                            "Email অথবা password ভুল।";

                    } else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        text =
                            "এই email দিয়ে কোনো account পাওয়া যায়নি।";

                    } else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        text =
                            "Password ভুল।";
                    }

                    showMessage(
                        text,
                        "error"
                    );
                }

            }
        );


    /*
     * LOGOUT
     */

    async function logoutUser() {

        try {

            await signOut(auth);

            showMessage(
                "Logout successful."
            );

            showSection(homeSection);

        } catch (error) {

            console.error(error);

            showMessage(
                "Logout failed.",
                "error"
            );
        }
    }


    logoutBtn.addEventListener(
        "click",
        logoutUser
    );

    dashboardLogoutBtn.addEventListener(
        "click",
        logoutUser
    );


    /*
     * AUTH STATE
     */

    onAuthStateChanged(
        auth,
        function(user) {

            if (user) {

                /*
                 * User logged in
                 */

                loginNavBtn.classList.add(
                    "hidden"
                );

                registerNavBtn.classList.add(
                    "hidden"
                );

                dashboardNavBtn.classList.remove(
                    "hidden"
                );

                logoutBtn.classList.remove(
                    "hidden"
                );


                userEmail.textContent =
                    "Email: " +
                    user.email;

                /*
                 * Display name comes
                 * from Firestore profile.
                 */

                import(
                    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
                ).then(async ({
                    getDoc,
                    doc
                }) => {

                    try {

                        const profile =
                            await getDoc(
                                doc(
                                    db,
                                    "users",
                                    user.uid
                                )
                            );

                        if (
                            profile.exists()
                        ) {

                            const data =
                                profile.data();

                            userName.textContent =
                                "Name: " +
                                (data.name || "User");

                        } else {

                            userName.textContent =
                                "Name: User";
                        }

                    } catch (error) {

                        console.error(error);

                        userName.textContent =
                            "Name: User";
                    }

                });


            } else {

                /*
                 * User logged out
                 */

                loginNavBtn.classList.remove(
                    "hidden"
                );

                registerNavBtn.classList.remove(
                    "hidden"
                );

                dashboardNavBtn.classList.add(
                    "hidden"
                );

                logoutBtn.classList.add(
                    "hidden"
                );

                showSection(homeSection);
            }

        }
    );


    /*
     * Firebase connection check
     */

    if (auth && db) {

        console.log(
            "✅ Firebase Authentication + Firestore connected successfully!"
        );

    }

</script>

</body>
</html>
